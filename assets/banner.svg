<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="grid-pattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .command-text { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; font-size: 14px; fill: #7d8590; }
      .prompt-symbol { fill: #238636; font-weight: bold; }
      .prompt-path { fill: #58a6ff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#title-gradient); filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.5)); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; letter-spacing: 0.5px; }
      .pill-text { font-family: 'Fira Code', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
      
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: cursor-blink 1s infinite; fill: #58a6ff; }
      
      @keyframes float-particle {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
        50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
        100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
      }
      .particle-1 { animation: float-particle 8s infinite ease-in-out; }
      .particle-2 { animation: float-particle 12s infinite ease-in-out; animation-delay: -3s; }
      .particle-3 { animation: float-particle 10s infinite ease-in-out; animation-delay: -6s; }

      @keyframes wave-bg {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }
      .bg-wave { animation: wave-bg 15s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)" stroke="#30363d" stroke-width="2" />
  
  <!-- Subtle Grid Lines -->
  <rect width="1200" height="320" rx="16" fill="url(#grid-pattern)" />

  <!-- Animated Dynamic Background Elements (Kept faint and in background) -->
  <g class="bg-wave" opacity="0.15">
    <path d="M-100,260 Q 200,180 500,270 T 1100,220 T 1400,280" fill="none" stroke="#58a6ff" stroke-width="3" />
    <path d="M-100,280 Q 300,220 600,290 T 1200,240 T 1500,300" fill="none" stroke="#bc8cff" stroke-width="2" />
  </g>

  <!-- Floating Particles/Icons in Background -->
  <g class="particle-1" opacity="0.4">
    <circle cx="150" cy="80" r="4" fill="#58a6ff" />
    <polygon points="1050,90 1060,105 1040,105" fill="#3fb950" />
  </g>
  <g class="particle-2" opacity="0.4">
    <rect x="980" y="220" width="8" height="8" rx="2" fill="#bc8cff" />
    <circle cx="220" cy="240" r="5" fill="#d29922" />
  </g>
  <g class="particle-3" opacity="0.3">
    <polygon points="1120,260 1130,275 1110,275" fill="#58a6ff" />
  </g>

  <!-- Decorative Terminal Top Bar Lines -->
  <g transform="translate(60, 45)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56" />
    <circle cx="20" cy="0" r="6" fill="#ffbd2e" />
    <circle cx="40" cy="0" r="6" fill="#27c93f" />
    <text x="65" y="4" class="command-text"><tspan class="prompt-symbol">user@dev</tspan>:<tspan class="prompt-path">~/awesome-shell</tspan>$ ./init_productivity.sh<tspan class="cursor">█</tspan></text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed high visibility and contrast) -->
  <g transform="translate(60, 145)">
    <text x="0" y="0" class="title">Awesome Command-Line Shell Scripting 🚀</text>
    <text x="0" y="38" class="subtitle">A curated list of shell interpreters, SaaS products, terminal tools &amp; open-source projects</text>
  </g>

  <!-- Feature Pills / Badges in Foreground Footer -->
  <g transform="translate(60, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="140" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#3fb950" />
      <text x="34" y="21" class="pill-text">Shell Engines</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(155, 0)">
      <rect width="150" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#58a6ff" />
      <text x="34" y="21" class="pill-text">SaaS &amp; Enterprise</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(320, 0)">
      <rect width="165" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#bc8cff" />
      <text x="34" y="21" class="pill-text">CLI Productivity</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(500, 0)">
      <rect width="155" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#d29922" />
      <text x="34" y="21" class="pill-text">Open-Source</text>
    </g>
  </g>
</svg>
